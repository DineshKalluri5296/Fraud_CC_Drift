global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: fraud-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - fraud-service.fraud.svc.cluster.local:8000

  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod

  - job_name: kubernetes-services
    kubernetes_sd_configs:
      - role: service