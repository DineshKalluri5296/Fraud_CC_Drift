groups:
  - name: fraud-alerts

    rules:

      - alert: FraudAPIUnavailable
        expr: up{job="fraud-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Fraud API is Down
          description: Fraud Detection API is not reachable.

      - alert: HighLatency
        expr: histogram_quantile(0.95,
          sum(rate(request_latency_seconds_bucket[5m])) by (le))
          > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High Prediction Latency
          description: Prediction latency exceeds 1 second.

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU Usage
          description: CPU usage is above 80%.

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 1000000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High Memory Usage
          description: Memory usage exceeds 1GB.

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High Error Rate
          description: API error rate exceeds 5%.

      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pod Restarting Frequently
          description: Pod restarted more than 3 times.