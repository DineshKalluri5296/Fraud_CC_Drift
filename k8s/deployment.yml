```yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: fraud-api
  namespace: fraud
  labels:
    app: fraud-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fraud-api

  template:
    metadata:
      labels:
        app: fraud-api

    spec:
      automountServiceAccountToken: false

      containers:
        - name: fraud-api

          image: 821656895219.dkr.ecr.us-east-1.amazonaws.com/fraud-api:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: fraud-config

            - secretRef:
                name: fraud-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
```
