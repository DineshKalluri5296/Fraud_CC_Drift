apiVersion: monitoring.coreos.com/v1

kind: ServiceMonitor

metadata:

  name: fraud-servicemonitor

  namespace: monitoring

  labels:

    release: monitoring

spec:

  selector:

    matchLabels:

      app: fraud-api

  namespaceSelector:

    matchNames:

      - fraud

  endpoints:

  - port: http

    path: /metrics

    interval: 15s

    scrapeTimeout: 10s