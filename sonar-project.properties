sonar.projectKey=Fraud MLOps

sonar.projectName=Fraud MLOps

sonar.projectVersion=1.0

# Production source code
sonar.sources=model,app

# Test code
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Python
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.ipynb,**/venv/**,**/.venv/**,**/.env/**,model/model.pkl

# Do not calculate coverage for tests or drift utility
sonar.coverage.exclusions=tests/**,model/detect_data_drift.py

# Coverage report generated by pytest
sonar.python.coverage.reportPaths=coverage.xml


