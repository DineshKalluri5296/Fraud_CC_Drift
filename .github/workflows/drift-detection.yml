name: Fraud Data Drift Detection

on:

  # Automatically run when current dataset changes
  push:
    paths:
      - "data/current.csv"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # Checkout Repository
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # Setup Python
      # =====================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # =====================================
      # Verify Dataset
      # =====================================

      - name: Verify Dataset
        run: |
          echo "======================================"
          echo "CSV FILES"
          echo "======================================"

          find data -type f -name "*.csv" -print

          echo ""
          echo "Checking required files..."

          test -f data/reference.csv
          test -f data/current.csv

          echo "reference.csv FOUND"
          echo "current.csv FOUND"


      # =====================================
      # Install Dependencies
      # =====================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================
      # Create Artifacts Directory
      # =====================================

      - name: Create Artifacts Directory
        run: |
          mkdir -p artifacts


      # =====================================
      # Detect Data / Schema Drift
      # =====================================

      - name: Detect Data Drift
        run: |
          python model/detect_data_drift.py


      # =====================================
      # Display Drift Report
      # =====================================

      - name: Display Drift Report
        run: |

          echo "======================================"
          echo "DATA DRIFT RESULT"
          echo "======================================"

          cat artifacts/data_drift.json

          echo ""
          echo "======================================"
          echo "FULL DRIFT REPORT"
          echo "======================================"

          cat artifacts/drift_report.json


      # =====================================
      # Convert Drift Result to Prometheus
      # =====================================

      - name: Prepare Prometheus Metrics
        run: |

          python - <<'PY'
          import json

          with open("artifacts/drift_report.json") as f:
              report = json.load(f)

          # Overall drift score
          drift_score = float(
              report.get("overall_drift_score", 0)
          )

          # Overall drift status
          drift_detected = 1 if report.get(
              "drift_detected", False
          ) else 0

          # Schema drift status
          schema_drift_detected = 1 if report.get(
              "drift_type"
          ) == "schema_drift" else 0

          # Data/statistical drift
          data_drift_detected = 1 if report.get(
              "data_drift_detected", False
          ) else 0

          print("======================================")
          print("PROMETHEUS METRICS")
          print("======================================")

          print(f"data_drift_score={drift_score}")
          print(f"data_drift_detected={data_drift_detected}")
          print(f"schema_drift_detected={schema_drift_detected}")
          print(f"drift_detected={drift_detected}")

          # Save metrics
          with open("artifacts/drift_metrics.txt", "w") as f:

              f.write(
                  "# HELP fraud_data_drift_score "
                  "Overall fraud dataset drift score.\n"
              )

              f.write(
                  "# TYPE fraud_data_drift_score gauge\n"
              )

              f.write(
                  f"fraud_data_drift_score "
                  f"{drift_score}\n"
              )

              f.write(
                  "# HELP fraud_data_drift_detected "
                  "Whether fraud data drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_data_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_data_drift_detected "
                  f"{data_drift_detected}\n"
              )

              f.write(
                  "# HELP fraud_schema_drift_detected "
                  "Whether fraud schema drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_schema_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_schema_drift_detected "
                  f"{schema_drift_detected}\n"
              )

              f.write(
                  "# HELP fraud_drift_detected "
                  "Whether any fraud drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_drift_detected "
                  f"{drift_detected}\n"
              )

          print("")
          print("Metrics file created:")
          print("artifacts/drift_metrics.txt")
          PY


      # =====================================
      # Display Prometheus Metrics
      # =====================================

      - name: Display Prometheus Metrics
        run: |
          echo "======================================"
          echo "PROMETHEUS METRICS"
          echo "======================================"

          cat artifacts/drift_metrics.txt


      # =====================================
      # Push Metrics to Pushgateway
      # =====================================

      - name: Push Drift Metrics to Pushgateway
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          if [ -z "$PUSHGATEWAY_URL" ]; then
            echo "ERROR: PUSHGATEWAY_URL secret is not configured."
            exit 1
          fi

          echo "Pushing drift metrics to Pushgateway..."

          curl --fail-with-body \
            --retry 3 \
            --data-binary @artifacts/drift_metrics.txt \
            "${PUSHGATEWAY_URL}/metrics/job/fraud-drift"

          echo ""
          echo "Drift metrics successfully pushed."


      # =====================================
      # Upload Drift Reports
      # =====================================

      - name: Upload Drift Reports
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: |
            artifacts/data_drift.json
            artifacts/drift_report.json
            artifacts/drift_metrics.txt
