name: Fraud Data Drift Detection

on:
  push:
    paths:
      - "data/current.csv"

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # Checkout Repository
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # Setup Python
      # =====================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # =====================================
      # Verify Dataset
      # =====================================

      - name: Verify Dataset
        run: |
          echo "======================================"
          echo "VERIFYING DATASETS"
          echo "======================================"

          find data -type f -name "*.csv" -print

          echo ""

          test -f data/reference.csv
          test -f data/current.csv

          echo "reference.csv FOUND"
          echo "current.csv FOUND"


      # =====================================
      # Install Dependencies
      # =====================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================
      # Create Artifacts Directory
      # =====================================

      - name: Create Artifacts Directory
        run: |
          mkdir -p artifacts


      # =====================================
      # Detect Data Drift
      # =====================================

      - name: Detect Data Drift
        run: |
          python model/detect_data_drift.py


      # =====================================
      # Display Drift Report
      # =====================================

      - name: Display Drift Report
        run: |
          echo "======================================"
          echo "DATA DRIFT RESULT"
          echo "======================================"

          cat artifacts/data_drift.json

          echo ""

          echo "======================================"
          echo "FULL DRIFT REPORT"
          echo "======================================"

          cat artifacts/drift_report.json


      # =====================================
      # Prepare Prometheus Metrics
      # =====================================

      - name: Prepare Prometheus Metrics
        run: |

          python - <<'PY'

          import json

          with open(
              "artifacts/drift_report.json",
              "r",
              encoding="utf-8"
          ) as f:

              report = json.load(f)


          # =====================================
          # Drift Score
          # =====================================

          drift_score = float(
              report.get(
                  "overall_drift_score",
                  0
              )
          )


          # =====================================
          # Overall Drift
          # =====================================

          drift_detected = int(
              bool(
                  report.get(
                      "drift_detected",
                      False
                  )
              )
          )


          # =====================================
          # Data Drift
          # =====================================

          data_drift_detected = int(
              bool(
                  report.get(
                      "data_drift_detected",
                      False
                  )
              )
          )


          # =====================================
          # Schema Drift
          # =====================================

          schema_drift_detected = int(
              report.get(
                  "drift_type",
                  ""
              ) == "schema_drift"
          )


          # =====================================
          # Create Prometheus Metrics
          # =====================================

          with open(
              "artifacts/drift_metrics.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "# HELP fraud_data_drift_score "
                  "Overall fraud dataset drift score.\n"
              )

              f.write(
                  "# TYPE fraud_data_drift_score gauge\n"
              )

              f.write(
                  f"fraud_data_drift_score {drift_score}\n"
              )


              f.write(
                  "# HELP fraud_data_drift_detected "
                  "Whether fraud data drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_data_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_data_drift_detected "
                  f"{data_drift_detected}\n"
              )


              f.write(
                  "# HELP fraud_schema_drift_detected "
                  "Whether schema drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_schema_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_schema_drift_detected "
                  f"{schema_drift_detected}\n"
              )


              f.write(
                  "# HELP fraud_drift_detected "
                  "Whether any fraud drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_drift_detected "
                  f"{drift_detected}\n"
              )


          print("")
          print("======================================")
          print("GENERATED PROMETHEUS METRICS")
          print("======================================")

          print(
              f"fraud_data_drift_score {drift_score}"
          )

          print(
              f"fraud_data_drift_detected "
              f"{data_drift_detected}"
          )

          print(
              f"fraud_schema_drift_detected "
              f"{schema_drift_detected}"
          )

          print(
              f"fraud_drift_detected "
              f"{drift_detected}"
          )

          PY


      # =====================================
      # Display Metrics
      # =====================================

      - name: Display Prometheus Metrics
        run: |

          echo "======================================"
          echo "METRICS TO PUSH"
          echo "======================================"

          cat artifacts/drift_metrics.txt


      # =====================================
      # Verify Pushgateway
      # =====================================

      - name: Verify Pushgateway
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          if [ -z "$PUSHGATEWAY_URL" ]; then
            echo "ERROR: PUSHGATEWAY_URL secret is missing."
            exit 1
          fi

          echo "======================================"
          echo "CHECKING PUSHGATEWAY"
          echo "======================================"

          curl \
            -L \
            --fail-with-body \
            --retry 3 \
            --silent \
            --show-error \
            "${PUSHGATEWAY_URL}/-/ready"

          echo ""

          echo "Pushgateway is reachable."


      # =====================================
      # PUSH LATEST METRICS
      # =====================================

      - name: Push Latest Drift Metrics
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          echo "======================================"
          echo "PUSHING LATEST DRIFT METRICS"
          echo "======================================"

          echo ""
          echo "Metrics being pushed:"
          echo ""

          cat artifacts/drift_metrics.txt

          echo ""

          echo "Pushgateway:"
          echo "$PUSHGATEWAY_URL"

          echo ""

          echo "Sending metrics..."

          HTTP_CODE=$(curl \
            -L \
            --silent \
            --show-error \
            --output /tmp/push_response.txt \
            --write-out "%{http_code}" \
            --request PUT \
            --data-binary @artifacts/drift_metrics.txt \
            "${PUSHGATEWAY_URL}/metrics/job/fraud-drift")

          echo ""

          echo "PUSH HTTP STATUS: $HTTP_CODE"

          echo ""

          cat /tmp/push_response.txt || true

          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || \
             [ "$HTTP_CODE" -ge 300 ]; then

            echo "ERROR: Pushgateway push failed."

            exit 1

          fi

          echo "======================================"
          echo "PUSH SUCCESSFUL"
          echo "======================================"


      # =====================================
      # VERIFY EXACT JOB METRICS
      # =====================================

      - name: Verify Latest Pushgateway Metrics
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          echo "======================================"
          echo "VERIFYING PUSHGATEWAY"
          echo "======================================"

          RESPONSE=$(curl \
            -L \
            --fail-with-body \
            --retry 3 \
            --silent \
            --show-error \
            "${PUSHGATEWAY_URL}/metrics")

          echo ""

          echo "======================================"
          echo "FRAUD-DRIFT METRICS"
          echo "======================================"

          echo "$RESPONSE" | grep \
            'job="fraud-drift"' || true

          echo ""

          echo "======================================"
          echo "EXPECTED METRICS"
          echo "======================================"

          cat artifacts/drift_metrics.txt

          echo ""

          echo "======================================"
          echo "VERIFICATION COMPLETE"
          echo "======================================"


      # =====================================
      # Upload Drift Reports
      # =====================================

      - name: Upload Drift Reports
        uses: actions/upload-artifact@v4

        with:

          name: drift-reports

          path: |
            artifacts/data_drift.json
            artifacts/drift_report.json
            artifacts/drift_metrics.txt
