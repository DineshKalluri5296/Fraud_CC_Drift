name: Fraud Data Drift Detection

on:

  push:
    paths:
      - "data/current.csv"

  workflow_dispatch:


env:
  PYTHON_VERSION: "3.11"


jobs:

  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # Checkout Repository
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # Setup Python
      # =====================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # =====================================
      # Verify Dataset
      # =====================================

      - name: Verify Dataset
        run: |

          echo "======================================"
          echo "VERIFYING DATASETS"
          echo "======================================"

          find data -type f -name "*.csv" -print

          test -f data/reference.csv
          test -f data/current.csv

          echo "reference.csv FOUND"
          echo "current.csv FOUND"


      # =====================================
      # Install Dependencies
      # =====================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================
      # Create Artifacts Directory
      # =====================================

      - name: Create Artifacts Directory
        run: |

          mkdir -p artifacts


      # =====================================
      # Detect Data Drift
      # =====================================

      - name: Detect Data Drift
        run: |

          echo "======================================"
          echo "RUNNING DATA DRIFT DETECTION"
          echo "======================================"

          python model/detect_data_drift.py


      # =====================================
      # Display Drift Report
      # =====================================

      - name: Display Drift Report
        run: |

          echo "======================================"
          echo "DATA DRIFT RESULT"
          echo "======================================"

          cat artifacts/data_drift.json

          echo ""

          echo "======================================"
          echo "FULL DRIFT REPORT"
          echo "======================================"

          cat artifacts/drift_report.json


      # =====================================
      # Prepare Prometheus Metrics
      # =====================================

      - name: Prepare Prometheus Metrics
        run: |

          python - <<'PY'

          import json

          REPORT_FILE = "artifacts/drift_report.json"
          METRICS_FILE = "artifacts/drift_metrics.txt"

          with open(
              REPORT_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              report = json.load(f)


          # =====================================
          # Drift Score
          # =====================================

          drift_score = float(
              report.get(
                  "overall_drift_score",
                  0.0
              )
          )


          # =====================================
          # Data Drift
          # =====================================

          data_drift_detected = int(
              bool(
                  report.get(
                      "data_drift_detected",
                      False
                  )
              )
          )


          # =====================================
          # Schema Drift
          # =====================================

          schema_drift_detected = int(
              report.get(
                  "drift_type",
                  ""
              ) == "schema_drift"
          )


          # =====================================
          # Overall Drift
          # =====================================

          drift_detected = int(
              bool(
                  report.get(
                      "drift_detected",
                      False
                  )
              )
          )


          # =====================================
          # Create Prometheus Metrics
          # =====================================

          with open(
              METRICS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "# HELP fraud_data_drift_score "
                  "Overall fraud dataset drift score.\n"
              )

              f.write(
                  "# TYPE fraud_data_drift_score gauge\n"
              )

              f.write(
                  f"fraud_data_drift_score "
                  f"{drift_score}\n"
              )


              f.write(
                  "# HELP fraud_data_drift_detected "
                  "Whether fraud data drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_data_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_data_drift_detected "
                  f"{data_drift_detected}\n"
              )


              f.write(
                  "# HELP fraud_schema_drift_detected "
                  "Whether schema drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_schema_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_schema_drift_detected "
                  f"{schema_drift_detected}\n"
              )


              f.write(
                  "# HELP fraud_drift_detected "
                  "Whether any fraud drift was detected.\n"
              )

              f.write(
                  "# TYPE fraud_drift_detected gauge\n"
              )

              f.write(
                  f"fraud_drift_detected "
                  f"{drift_detected}\n"
              )


          # =====================================
          # Display Metrics
          # =====================================

          print(
              "======================================"
          )

          print(
              "PROMETHEUS METRICS"
          )

          print(
              "======================================"
          )

          print(
              f"fraud_data_drift_score {drift_score}"
          )

          print(
              f"fraud_data_drift_detected "
              f"{data_drift_detected}"
          )

          print(
              f"fraud_schema_drift_detected "
              f"{schema_drift_detected}"
          )

          print(
              f"fraud_drift_detected "
              f"{drift_detected}"
          )

          PY


      # =====================================
      # Display Metrics
      # =====================================

      - name: Display Prometheus Metrics
        run: |

          echo "======================================"
          echo "METRICS TO PUSH"
          echo "======================================"

          cat artifacts/drift_metrics.txt


      # =====================================
      # Validate Pushgateway Secret
      # =====================================

      - name: Validate Pushgateway URL
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          if [ -z "$PUSHGATEWAY_URL" ]; then

            echo "ERROR: PUSHGATEWAY_URL secret is missing."

            exit 1

          fi


          echo "Pushgateway URL configured."


      # =====================================
      # Check Pushgateway
      # =====================================

      - name: Check Pushgateway
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          echo "======================================"
          echo "CHECKING PUSHGATEWAY"
          echo "======================================"


          curl \
            --fail-with-body \
            --retry 5 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "${PUSHGATEWAY_URL}/-/ready"


          echo ""

          echo "Pushgateway is reachable."


      # =====================================
      # Push Latest Metrics
      # =====================================

      - name: Push Latest Drift Metrics
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          echo "======================================"
          echo "PUSHING LATEST DRIFT METRICS"
          echo "======================================"


          echo ""
          echo "Metrics:"
          echo ""

          cat artifacts/drift_metrics.txt


          echo ""
          echo "======================================"
          echo "PUT REQUEST"
          echo "======================================"


          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/pushgateway_response.txt \
            --write-out "%{http_code}" \
            --request PUT \
            --header "Content-Type: text/plain; version=0.0.4" \
            --data-binary @artifacts/drift_metrics.txt \
            "${PUSHGATEWAY_URL}/metrics/job/fraud-drift")


          echo ""

          echo "Pushgateway HTTP status: $HTTP_CODE"


          if [ -s /tmp/pushgateway_response.txt ]; then

            echo ""
            echo "Pushgateway response:"

            cat /tmp/pushgateway_response.txt

          fi


          echo ""


          if [ "$HTTP_CODE" -lt 200 ] || \
             [ "$HTTP_CODE" -ge 300 ]; then

            echo "ERROR: Pushgateway push failed."

            exit 1

          fi


          echo "Metrics pushed successfully."


      # =====================================
      # Verify Latest Metrics
      # =====================================

      - name: Verify Latest Pushgateway Metrics
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

        run: |

          echo "======================================"
          echo "VERIFYING PUSHGATEWAY"
          echo "======================================"


          RESPONSE=$(curl \
            --fail-with-body \
            --retry 5 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "${PUSHGATEWAY_URL}/metrics")


          echo ""

          echo "======================================"
          echo "FRAUD METRICS IN PUSHGATEWAY"
          echo "======================================"


          echo "$RESPONSE" | grep -E \
            'fraud_data_drift_score|fraud_data_drift_detected|fraud_schema_drift_detected|fraud_drift_detected' \
            || true


          # =====================================
          # Expected Values
          # =====================================

          EXPECTED_SCORE=$(grep \
            '^fraud_data_drift_score ' \
            artifacts/drift_metrics.txt | \
            awk '{print $2}')


          EXPECTED_DATA_DRIFT=$(grep \
            '^fraud_data_drift_detected ' \
            artifacts/drift_metrics.txt | \
            awk '{print $2}')


          EXPECTED_SCHEMA_DRIFT=$(grep \
            '^fraud_schema_drift_detected ' \
            artifacts/drift_metrics.txt | \
            awk '{print $2}')


          EXPECTED_DRIFT=$(grep \
            '^fraud_drift_detected ' \
            artifacts/drift_metrics.txt | \
            awk '{print $2}')


          # =====================================
          # Actual Values
          # =====================================

          ACTUAL_SCORE=$(echo "$RESPONSE" | \
            grep 'fraud_data_drift_score{' | \
            grep 'job="fraud-drift"' | \
            awk '{print $2}' | \
            tail -1)


          ACTUAL_DATA_DRIFT=$(echo "$RESPONSE" | \
            grep 'fraud_data_drift_detected{' | \
            grep 'job="fraud-drift"' | \
            awk '{print $2}' | \
            tail -1)


          ACTUAL_SCHEMA_DRIFT=$(echo "$RESPONSE" | \
            grep 'fraud_schema_drift_detected{' | \
            grep 'job="fraud-drift"' | \
            awk '{print $2}' | \
            tail -1)


          ACTUAL_DRIFT=$(echo "$RESPONSE" | \
            grep 'fraud_drift_detected{' | \
            grep 'job="fraud-drift"' | \
            awk '{print $2}' | \
            tail -1)


          # =====================================
          # Display Expected
          # =====================================

          echo ""

          echo "======================================"
          echo "EXPECTED VALUES"
          echo "======================================"


          echo "Drift Score        : $EXPECTED_SCORE"

          echo "Data Drift         : $EXPECTED_DATA_DRIFT"

          echo "Schema Drift       : $EXPECTED_SCHEMA_DRIFT"

          echo "Overall Drift      : $EXPECTED_DRIFT"


          # =====================================
          # Display Actual
          # =====================================

          echo ""

          echo "======================================"
          echo "ACTUAL VALUES"
          echo "======================================"


          echo "Drift Score        : $ACTUAL_SCORE"

          echo "Data Drift         : $ACTUAL_DATA_DRIFT"

          echo "Schema Drift       : $ACTUAL_SCHEMA_DRIFT"

          echo "Overall Drift      : $ACTUAL_DRIFT"


          # =====================================
          # Validate Values
          # =====================================

          echo ""

          echo "======================================"
          echo "VALIDATING"
          echo "======================================"


          if [ -z "$ACTUAL_SCORE" ]; then

            echo "ERROR: fraud_data_drift_score not found."

            exit 1

          fi


          if [ "$EXPECTED_SCORE" != "$ACTUAL_SCORE" ]; then

            echo "ERROR: Drift score mismatch."

            exit 1

          fi


          if [ "$EXPECTED_DATA_DRIFT" != "$ACTUAL_DATA_DRIFT" ]; then

            echo "ERROR: Data drift mismatch."

            exit 1

          fi


          if [ "$EXPECTED_SCHEMA_DRIFT" != "$ACTUAL_SCHEMA_DRIFT" ]; then

            echo "ERROR: Schema drift mismatch."

            exit 1

          fi


          if [ "$EXPECTED_DRIFT" != "$ACTUAL_DRIFT" ]; then

            echo "ERROR: Overall drift mismatch."

            exit 1

          fi


          echo ""

          echo "======================================"
          echo "SUCCESS"
          echo "======================================"


          echo "Pushgateway contains the latest metrics."


      # =====================================
      # Upload Artifacts
      # =====================================

      - name: Upload Drift Reports
        uses: actions/upload-artifact@v4

        with:

          name: drift-reports

          path: |

            artifacts/data_drift.json
            artifacts/drift_report.json
            artifacts/drift_metrics.txt
