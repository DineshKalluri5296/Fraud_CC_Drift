name: Fraud Data Drift Detection

on:
  push:
    paths:
      - "data/current.csv"

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # Checkout Repository
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # Debug Repository / Dataset
      # =====================================

      - name: Check Dataset Files
        run: |
          echo "======================================"
          echo "Current working directory"
          echo "======================================"
          pwd

          echo ""
          echo "======================================"
          echo "Repository files"
          echo "======================================"
          find . -type f | sort

          echo ""
          echo "======================================"
          echo "Data directory"
          echo "======================================"
          ls -lah data || true

          echo ""
          echo "======================================"
          echo "Checking current.csv"
          echo "======================================"
          if [ -f "data/current.csv" ]; then
            echo "current.csv FOUND"
            ls -lh data/current.csv
          else
            echo "ERROR: data/current.csv NOT FOUND"
            exit 1
          fi


      # =====================================
      # Python
      # =====================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # =====================================
      # Dependencies
      # =====================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================
      # Create Artifacts Directory
      # =====================================

      - name: Create Artifacts Directory
        run: |
          mkdir -p artifacts


      # =====================================
      # Detect Drift
      # =====================================

      - name: Detect Data Drift
        run: |
          python model/detect_data_drift.py


      # =====================================
      # Display Drift Result
      # =====================================

      - name: Display Drift Report
        run: |
          echo "======================================"
          echo "DATA DRIFT RESULT"
          echo "======================================"

          if [ -f "artifacts/data_drift.json" ]; then
            cat artifacts/data_drift.json
          else
            echo "ERROR: data_drift.json not found"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "DRIFT REPORT"
          echo "======================================"

          if [ -f "artifacts/drift_report.json" ]; then
            cat artifacts/drift_report.json
          else
            echo "ERROR: drift_report.json not found"
            exit 1
          fi


      # =====================================
      # Upload Drift Reports
      # =====================================

      - name: Upload Drift Reports
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: |
            artifacts/data_drift.json
            artifacts/drift_report.json
