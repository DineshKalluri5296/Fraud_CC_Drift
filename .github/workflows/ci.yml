name: Fraud Detection CI

on:

  workflow_dispatch:
 
env:
  PYTHON_VERSION: "3.11"

jobs:
  test:

    runs-on: ubuntu-latest
    steps:

      # =====================================
      # Checkout Repository
      # =====================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================
      # Setup Python
      # =====================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # =====================================
      # Install Dependencies
      # =====================================
      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      # =====================================
      # Configure AWS Credentials
      # =====================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =====================================
      # Verify AWS
      # =====================================
      - name: Verify AWS
        run: |
          aws sts get-caller-identity

      # =====================================
      # Check Model in S3
      # =====================================
      - name: Check Model in S3

        id: model
        run: |
          if aws s3 ls \
          s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl \
          > /dev/null 2>&1

          then

            echo "exists=true" >> $GITHUB_OUTPUT

          else

            echo "exists=false" >> $GITHUB_OUTPUT

          fi

      # =====================================
      # Download Existing Model
      # =====================================
      - name: Download Model

        if: steps.model.outputs.exists == 'true'
        run: |
          mkdir -p model
          aws s3 cp \
          s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl \
          model/model.pkl



      # =====================================
      # First Model Training
      # =====================================
      - name: Train First Model
        if: steps.model.outputs.exists == 'false'
        run: |
          python model/train.py

      # =====================================
      # Evaluate First Model
      # =====================================
      - name: Evaluate First Model
        if: steps.model.outputs.exists == 'false'
        run: |
            python model/evaluate.py

      # =====================================
      # Upload First Model
      # =====================================
      - name: Upload First Model
        if: steps.model.outputs.exists == 'false'
        run: aws s3 cp model/model.pkl s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl

      # ===================================== 
      # Data Drift Detection
      # =====================================
      - name: Detect Data Drift
        if: steps.model.outputs.exists == 'true'
        run: |
          python model/detect_data_drift.py

      # =====================================
      # Check Data Drift
      # =====================================
      - name: Check Data Drift Status
        id: drift
        if: steps.model.outputs.exists == 'true'
        run: |
           python <<EOF
           import json
           import os

           with open("artifacts/data_drift.json") as f:
               result = json.load(f)
           output = os.environ["GITHUB_OUTPUT"]

           with open(output, "a") as g:
              if result["data_drift_detected"]:
                 print("Data drift detected")
                 g.write("drift=true\n")
              else:
                 print("No data drift detected")
                 g.write("drift=false\n")
           EOF
      # =====================================
      # Retrain Model
      # =====================================
      - name: Retrain Model
        if: steps.drift.outputs.drift == 'true'
        run: |
          python model/train.py

      # =====================================
      # Evaluate Retrained Model
      # =====================================
      - name: Evaluate Retrained Model
        if: steps.drift.outputs.drift == 'true'
        run: |
          python model/evaluate.py

      # =====================================
      # Upload Retrained Model
      # =====================================
      - name: Upload Retrained Model
        if: steps.drift.outputs.drift == 'true'
        run: aws s3 cp model/model.pkl s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl

      # =====================================
      # Upload Drift Reports
      # =====================================
      - name: Upload Drift Reports

        if: always() && steps.model.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: |
            artifacts/data_drift.json

      # =====================================
      # Verify Model
      # =====================================
      - name: Verify Model
        run: |
          ls -R
          if [ -f model/model.pkl ]; then
            echo "Model exists"
          else
             echo "Model not found"
             exit 1
          fi

      # =====================================
      # Run Tests
      # =====================================
      - name: Run Tests with Coverage

        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |

          pytest tests \
          --cov=app \
          --cov=model \
          --cov-report=xml \
          --cov-report=term

      # =====================================
      # SonarQube Scan
      # =====================================
      - name: SonarQube Scan

        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # =====================================
      # Sonar Quality Gate
      # =====================================
      - name: SonarQube Quality Gate

        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # =====================================
      # Upload Coverage
      # =====================================
      - name: Upload Coverage

        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # =====================================
      # Upload Test Results
      # =====================================
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache
            coverage.xml

      # =====================================
      # Login ECR
      # =====================================
      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      # =====================================
      # Build Docker Image
      # =====================================
      - name: Build Docker Image

        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |

          docker build \
          -f docker/Dockerfile \
          -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} \
          -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest \
          .
      # =====================================
      # Push Docker Image
      # =====================================
      - name: Push Docker Image

        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          docker push \
          $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
          $REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest
