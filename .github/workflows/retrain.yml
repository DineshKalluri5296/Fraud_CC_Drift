name: Model Retraining

on:

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

env:
  PYTHON_VERSION: "3.11"

jobs:

  retrain:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect Data Drift
        run: |
          python model/detect_data_drift.py

      - name: Detect Model Drift
        run: |
          python model/detect_model_drift.py

      - name: Retrain Model
        run: |
          python model/retrain.py

      - name: Evaluate Model
        run: |
          python model/evaluate.py

      - name: Upload Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            model/model.pkl
            model/scaler.pkl

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            artifacts/evaluation.json
            artifacts/drift_report.json