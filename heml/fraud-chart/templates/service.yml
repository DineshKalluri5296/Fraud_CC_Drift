apiVersion: v1
kind: Service

metadata:

  name: {{ include "fraud-chart.fullname" . }}

  labels:
    {{- include "fraud-chart.labels" . | nindent 4 }}

spec:

  selector:
    {{- include "fraud-chart.selectorLabels" . | nindent 4 }}

  type: {{ .Values.service.type }}

  ports:

    - name: http

      protocol: TCP

      port: {{ .Values.service.port }}

      targetPort: {{ .Values.service.targetPort }}