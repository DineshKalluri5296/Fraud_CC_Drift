{{- if .Values.serviceMonitor.enabled }}

apiVersion: monitoring.coreos.com/v1

kind: ServiceMonitor

metadata:

  name: {{ include "fraud-chart.fullname" . }}

spec:

  selector:

    matchLabels:
      app: fraud-api

  namespaceSelector:

    matchNames:

      - {{ .Release.Namespace }}

  endpoints:

    - port: http

      path: /metrics

      interval: {{ .Values.serviceMonitor.interval }}

      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}

{{- end }}